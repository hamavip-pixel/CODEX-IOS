
name: HAMA CODEX Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build HAMA CODEX IPA
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate --spec project.yml

      - name: Build iPadOS App
        run: |
          xcodebuild \
            -project HAMACODEX.xcodeproj \
            -scheme HAMACODEX \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/HAMACODEX.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: HAMACODEX.app not found"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -r HAMA-CODEX.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HAMA-CODEX-IPA
          path: HAMA-CODEX.ipa
